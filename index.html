<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Shared Budget</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- LOGIN SCREEN -->
<section id="login-screen" class="cover">
  <div class="cover-card">
    <p class="cover-mark">Household Ledger</p>
    <h1>Enter the password to open the books</h1>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
      <label for="password">Shared password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Open ledger</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>
</section>

<!-- APP -->
<section id="app-screen" class="app" hidden>
  <header class="app-header">
    <div class="header-left">
      <p class="cover-mark">Household Ledger</p>
      <div class="balance">
        <span class="balance-label">Balance</span>
        <span id="balance-amount" class="balance-amount">$0.00</span>
      </div>
    </div>
    <div class="header-right">
      <select id="month-select"></select>
      <button id="logout-btn" class="ghost-btn">Sign out</button>
    </div>
  </header>

  <main class="app-grid">

    <!-- Add entry -->
    <section class="panel" id="entry-panel">
      <h2>Add an entry</h2>
      <form id="entry-form">
        <div class="row">
          <button type="button" class="toggle-btn active" data-type="expense" id="type-expense">Expense</button>
          <button type="button" class="toggle-btn" data-type="income" id="type-income">Income</button>
        </div>
        <label for="amount">Amount</label>
        <input type="number" id="amount" step="0.01" min="0" required placeholder="0.00">

        <label for="category">Category</label>
        <select id="category" required></select>

        <label for="entry-date">Date</label>
        <input type="date" id="entry-date" required>

        <label for="note">Note (optional)</label>
        <input type="text" id="note" maxlength="120" placeholder="What was this for?">

        <button type="submit" class="primary-btn">Record entry</button>
      </form>
    </section>

    <!-- Budgets -->
    <section class="panel" id="budgets-panel">
      <div class="panel-head">
        <h2>Monthly budgets</h2>
        <button id="add-budget-btn" class="link-btn">+ Set a limit</button>
      </div>
      <div id="budgets-list" class="budgets-list"></div>
    </section>

    <!-- Charts -->
    <section class="panel" id="charts-panel">
      <h2>This month</h2>
      <div class="charts-grid">
        <div class="chart-box">
          <p class="chart-caption">Spending by category</p>
          <canvas id="category-chart" height="220"></canvas>
        </div>
        <div class="chart-box">
          <p class="chart-caption">Income vs. expenses, last 6 months</p>
          <canvas id="trend-chart" height="220"></canvas>
        </div>
      </div>
    </section>

    <!-- History -->
    <section class="panel" id="history-panel">
      <div class="panel-head">
        <h2>Entries</h2>
        <span id="history-count" class="muted"></span>
      </div>
      <table class="ledger-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Note</th>
            <th class="num">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr id="history-empty"><td colspan="5" class="muted">No entries yet this month.</td></tr>
        </tbody>
      </table>
    </section>

  </main>
</section>

<!-- Edit entry dialog -->
<dialog id="edit-dialog">
  <form id="edit-form">
    <h3>Edit entry</h3>
    <label for="edit-amount">Amount</label>
    <input type="number" id="edit-amount" step="0.01" min="0" required>
    <label for="edit-category">Category</label>
    <select id="edit-category" required></select>
    <label for="edit-date">Date</label>
    <input type="date" id="edit-date" required>
    <label for="edit-note">Note</label>
    <input type="text" id="edit-note" maxlength="120">
    <div class="dialog-actions">
      <button type="button" id="edit-cancel" class="ghost-btn">Cancel</button>
      <button type="submit" class="primary-btn">Save changes</button>
    </div>
  </form>
</dialog>

<!-- Set budget dialog -->
<dialog id="budget-dialog">
  <form id="budget-form">
    <h3>Set a category limit</h3>
    <label for="budget-category">Category</label>
    <select id="budget-category" required></select>
    <label for="budget-limit">Monthly limit</label>
    <input type="number" id="budget-limit" step="0.01" min="0" required>
    <div class="dialog-actions">
      <button type="button" id="budget-cancel" class="ghost-btn">Cancel</button>
      <button type="submit" class="primary-btn">Save limit</button>
    </div>
  </form>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
